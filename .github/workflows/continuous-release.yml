name: Continuous Desktop Release

# Build and publish desktop installers on every push to main so
# code.zog.watch download links stay current. Artifacts are unsigned until
# Apple/Windows signing secrets are configured on the repository.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zog-continuous-desktop-release
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      lockfile_sha256: ${{ steps.meta.outputs.lockfile_sha256 }}
    steps:
      - uses: actions/checkout@v6
      - id: meta
        name: Resolve build version
        shell: bash
        run: |
          # Keep filenames simple (Zog-<version>-arm64.dmg). Hyphenated prerelease
          # versions confused the macOS packaging path checks.
          version="0.7.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          lockfile_sha256="$(sha256sum bun.lock | awk '{print $1}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "lockfile_sha256=$lockfile_sha256" >> "$GITHUB_OUTPUT"
          echo "Publishing continuous release $tag"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build desktop artifact (unsigned)
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Force unsigned continuous builds even if signing secrets exist later
          # for the tagged Release Desktop workflow.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run dist:desktop:artifact -- \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.version.outputs.version }}" \
            --source-commit "${{ github.sha }}" \
            --lockfile-sha256 "${{ needs.version.outputs.lockfile_sha256 }}" \
            --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: ${{ always() && needs.version.result == 'success' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Require at least one installer
        shell: bash
        run: |
          count="$(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) | wc -l | tr -d ' ')"
          echo "Found $count installer asset(s)"
          find release-assets -type f | sort
          if [[ "$count" -lt 1 ]]; then
            echo "No desktop installers were produced." >&2
            exit 1
          fi

      - name: Publish release
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Zog Code Editor ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Continuous desktop build from `main` (`${{ github.sha }}`).

            Installers in this release are **unsigned** until Apple/Windows
            signing secrets are configured. macOS may require right-click → Open
            the first time; Windows SmartScreen may warn.

            Download page: https://code.zog.watch/download/
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.yml
            release-assets/*.blockmap

      - name: Ensure release is published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG was not created." >&2
            exit 1
          fi
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$draft" == "true" ]]; then
            echo "Publishing draft release $TAG after upload flake..."
            gh release edit "$TAG" --draft=false --latest
          fi
          assets="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join("\n")')"
          echo "$assets"
          if ! grep -Eq '\.(dmg|exe|AppImage)$' <<<"$assets"; then
            echo "Published release has no installers." >&2
            exit 1
          fi
